<title>My_AI Relay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f0f; color: #fff;
    display: flex; align-items: center; justify-content: center;
    min-height: 100dvh; padding: 24px;
  }
  .card {
    background: #1a1a1a; border-radius: 20px;
    padding: 40px 28px; width: 100%; max-width: 420px;
    text-align: center; border: 1px solid #2d2d2d;
  }
  .logo { display: block; width: 48px; height: 48px; margin: 0 auto 8px; }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  p.sub { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
  .spinner {
    width: 40px; height: 40px; margin: 12px auto;
    border: 3px solid #2d2d2d; border-top-color: #ff6b47;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 13px; color: #9ca3af; min-height: 18px; margin-top: 8px; }
  /* « start » : à gauche, à droite en arabe */
  .err {
    color: #ef4444; font-size: 13px; margin-top: 12px;
    text-align: start; overflow-wrap: anywhere;
  }
  ul.tries { list-style: none; padding: 0; margin: 16px 0 0; text-align: start; font-size: 12px; }
  ul.tries li { padding: 6px 0; color: #6b7280; border-bottom: 1px solid #1f1f1f; }
  ul.tries li.ok { color: #10b981; }
  ul.tries li.fail { color: #f87171; }
  ul.tries li .host { font-family: ui-monospace, monospace; font-size: 11px; opacity: 0.7; display: block; }
  a.btn {
    display: inline-block; margin-top: 18px;
    padding: 12px 20px; background: #ff6b47; color: #fff;
    text-decoration: none; border-radius: 12px; font-weight: 600; font-size: 14px;
  }
</style>

<script>
(function () {
  // ── Décodage du payload encodé dans le fragment d'URL ──────────────
  // Format : #d=<base64url(JSON{urls,token,key,lang})>
  // On utilise le fragment (et pas la query string) parce qu'il n'est
  // jamais envoyé au serveur GitHub Pages — confidentialité du token.
  function b64urlDecode(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    try { return atob(s); } catch (e) { return null; }
  }

  function parsePayload() {
    var hash = location.hash.replace(/^#/, '');
    var params = {};
    hash.split('&').forEach(function (pair) {
      var idx = pair.indexOf('=');
      if (idx < 0) return;
      params[pair.slice(0, idx)] = pair.slice(idx + 1);
    });
    if (!params.d) return null;
    var raw = b64urlDecode(decodeURIComponent(params.d));
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  // ── Langue de la page ──────────────────────────────────────────────
  // Celle de My_AI sur le PC (« lang » du payload), que parle aussi la page
  // mobile qui suit. Sinon (lien d'une version plus ancienne, lien
  // invalide) celle du téléphone, sinon l'anglais.
  var MESSAGES = JSON.parse(document.getElementById('messages').textContent);

  function pickLanguage(fromPc) {
    var wanted = [fromPc].concat(navigator.languages || [navigator.language]);
    for (var i = 0; i < wanted.length; i++) {
      var code = String(wanted[i] || '').toLowerCase().split('-')[0];
      if (Object.prototype.hasOwnProperty.call(MESSAGES, code)) return code;
    }
    return 'en';
  }

  var payload = parsePayload();
  var lang = pickLanguage(payload && payload.lang);
  var T = MESSAGES[lang];
  var triesEl = document.getElementById('tries');
  var statusEl = document.getElementById('status');
  var errEl = document.getElementById('err');
  var subEl = document.getElementById('sub');
  var spinnerEl = document.getElementById('spinner');

  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  document.title = 'My_AI Relay — ' + T.title;
  subEl.textContent = T.connecting;
  statusEl.textContent = T.searching;

  function fail(msg) {
    spinnerEl.style.display = 'none';
    subEl.textContent = T.failed;
    statusEl.textContent = '';
    errEl.style.display = 'block';
    errEl.textContent = msg;
    errEl.appendChild(document.createElement('br'));
    errEl.appendChild(document.createElement('br'));
    errEl.appendChild(document.createTextNode(T.checkPc));
  }

  if (!payload || !Array.isArray(payload.urls) || payload.urls.length === 0 || !payload.token) {
    fail(T.invalidLink);
    return;
  }
  // La clé E2EE est obligatoire depuis l'introduction du chiffrement
  // applicatif (AES-256-GCM). Sans elle, l'app mobile ne pourra ni
  // émettre ni déchiffrer aucun message.
  if (!payload.key) {
    fail(T.missingKey);
    return;
  }

  // ── Ping de chaque tunnel et redirection vers le premier qui répond ─
  // Stratégie : on lance les fetchs en parallèle (tous les tunnels sont
  // queryés en même temps), et on prend le premier qui répond OK avec un
  // payload JSON valide. Les autres requêtes sont annulées via AbortController.
  var aborters = [];
  var settled = false;
  var perUrlEl = {};

  function hostOf(url) {
    try { return new URL(url).hostname; } catch (e) { return url; }
  }

  function appendTry(url) {
    // Textes posés par textContent : le lien vient du QR code, rien n'y est interprété
    var li = document.createElement('li');
    var label = document.createElement('span');
    var host = document.createElement('span');
    label.textContent = T.testing;
    host.className = 'host';
    host.textContent = hostOf(url);
    li.appendChild(label);
    li.appendChild(host);
    triesEl.appendChild(li);
    perUrlEl[url] = li;
  }

  function markResult(url, ok, reason) {
    var li = perUrlEl[url];
    if (!li) return;
    li.className = ok ? 'ok' : 'fail';
    var label = ok ? '✓ ' + T.reachable : '✗ ' + (reason || T.unavailable);
    li.querySelector('span').textContent = label;
  }

  function abortAll() {
    aborters.forEach(function (a) { try { a.abort(); } catch (e) {} });
  }

  function redirect(url) {
    if (settled) return;
    settled = true;
    abortAll();
    statusEl.textContent = T.redirecting;
    var sep = url.indexOf('?') >= 0 ? '&' : '?';
    // serveo affiche une page d'avertissement à la première visite d'un
    // tunnel gratuit, et son bouton « Continue » recharge la page sans le
    // token ni la clé. Ce paramètre la saute : serveo pose son cookie et
    // redirige (302) vers la même adresse sans lui, le fragment #k suit.
    var skip = /\.serveo(usercontent\.com|\.net)$/.test(hostOf(url))
      ? '&serveo-skip-browser-warning=true' : '';
    // Le token reste en query (le serveur l'utilise pour authentifier),
    // mais la clé E2EE va dans le fragment (#k=...) pour ne PAS être
    // transmise au serveur de tunnel public. Seul le navigateur la lit.
    location.replace(
      url + sep + 'token=' + encodeURIComponent(payload.token) + skip +
      '#k=' + encodeURIComponent(payload.key)
    );
  }

  payload.urls.forEach(function (url) { appendTry(url); });

  var pending = payload.urls.length;
  payload.urls.forEach(function (url) {
    var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
    if (ctrl) aborters.push(ctrl);
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 5000);

    fetch(url + '/api/health', {
      method: 'GET',
      signal: ctrl ? ctrl.signal : undefined,
      cache: 'no-store',
      mode: 'cors',
      credentials: 'omit'
    }).then(function (r) {
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) {
      if (j && j.status === 'ok') {
        markResult(url, true);
        redirect(url);
      } else {
        markResult(url, false, T.unexpected);
      }
    }).catch(function (e) {
      clearTimeout(timer);
      var msg = (e && e.name === 'AbortError') ? T.timeout : T.networkError;
      markResult(url, false, msg);
    }).finally(function () {
      pending -= 1;
      if (pending === 0 && !settled) {
        fail(T.noTunnel);
      }
    });
  });

  // Garde-fou global : si tous les fetchs traînent (ex. CORS bloqué
  // silencieusement), on affiche quand même un échec après 8 s.
  setTimeout(function () {
    if (!settled && pending > 0) {
      fail(T.allTimedOut);
    }
  }, 8000);
})();
</script>
